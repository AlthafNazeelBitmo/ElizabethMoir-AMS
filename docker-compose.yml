# Local development:   docker compose up -d postgres          (or: pnpm db:up)
# Server deployment:   docker compose --profile prod up -d --build
#
# The prod profile runs Postgres + API + Caddy on one host. Postgres is never
# published on a public interface; only Caddy listens on 80/443.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ams}
      POSTGRES_DB: ams
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams -d ams"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://ams:${POSTGRES_PASSWORD:-ams}@postgres:5432/ams
      TRUST_PROXY: "true"
      SPOOL_DIR: /app/data/spool
    volumes:
      - spool:/app/data/spool
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  spool:
  caddy_data:
  caddy_config:
