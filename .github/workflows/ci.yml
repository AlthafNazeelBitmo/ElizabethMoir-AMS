name: CI

on:
  push:
    branches: [main]
  pull_request:

# The tests run against PGlite — Postgres compiled to WebAssembly, in
# process — so this needs no database service and no Docker.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Run on their own, with no other test file competing for the CPU: a
      # latency assertion under contention measures the runner, not the code.
      - name: Load and throughput
        run: pnpm test:load

  # The front end driven by a real browser against the real API on an
  # in-process Postgres. Nothing is mocked. Its own job so a browser
  # download never slows the unit tests down.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ams/shared build

      - name: Install Chromium
        run: pnpm --filter @ams/web exec playwright install --with-deps chromium

      - name: End-to-end
        run: pnpm e2e

      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The specification asks for the build to fail on a known
      # high-severity vulnerability. This holds a database of children's
      # movements, so "we will get to it" is not a position worth taking.
      - name: Dependency audit
        run: pnpm audit --audit-level high
